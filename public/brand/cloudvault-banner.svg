<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F9FC" />
      <stop offset="50%" stop-color="#EEF3FA" />
      <stop offset="100%" stop-color="#E2ECF8" />
    </linearGradient>
    <linearGradient id="bannerVaultGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#173A63" />
      <stop offset="100%" stop-color="#285F9E" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="260" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7FAFD" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="120" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#285F9E" />
      <stop offset="100%" stop-color="#173A63" />
    </linearGradient>
    <filter id="softShadow" x="-10" y="0" width="300" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173A63" flood-opacity="0.08" />
    </filter>
    <filter id="glowSubtle" x="-20" y="-20" width="140" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#285F9E" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" stroke="#DCE5EF" stroke-width="2" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="250" y1="0" x2="250" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="400" y1="0" x2="400" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="550" y1="0" x2="550" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="700" y1="0" x2="700" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="850" y1="0" x2="850" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="1000" y1="0" x2="1000" y2="420" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#DCE5EF" stroke-dasharray="4 8" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#DCE5EF" stroke-dasharray="4 8" />
  </g>

  <!-- Concentric Geometric Rings in Background -->
  <circle cx="1020" cy="210" r="180" stroke="#DCE9F8" stroke-width="1.5" stroke-dasharray="6 6" fill="none" />
  <circle cx="1020" cy="210" r="130" stroke="#DCE9F8" stroke-width="1.5" fill="none" />

  <!-- LEFT COLUMN: Brand Identity & Typography -->
  <g transform="translate(80, 75)">
    <!-- Brand Mark & Logo Header -->
    <g transform="translate(0, 0)">
      <!-- Logo Shield -->
      <g filter="url(#glowSubtle)">
        <path d="M 0 16 C 0 6 8 0 28 0 C 48 0 56 6 56 16 C 56 40 40 60 28 68 C 16 60 0 40 0 16 Z" fill="url(#bannerVaultGrad)" />
        <path d="M 11 14 C 11 11 14 9 19 9 L 34 9 L 45 20 L 45 48 C 45 52 42 55 38 55 L 19 55 C 14 55 11 52 11 48 Z" fill="#FFFFFF" fill-opacity="0.95" />
        <path d="M 34 9 L 34 20 L 45 20 Z" fill="#DCE9F8" />
        <circle cx="28" cy="35" r="7" fill="#173A63" />
        <circle cx="28" cy="35" r="4.5" fill="#FFFFFF" />
        <circle cx="28" cy="35" r="2.5" fill="#285F9E" />
      </g>

      <!-- Wordmark -->
      <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="44" fill="#173A63" letter-spacing="-0.8">Cloud<tspan fill="#285F9E" font-weight="600">Vault</tspan></text>
      
      <!-- Version & Category Pill -->
      <rect x="330" y="20" width="130" height="26" rx="6" fill="#DCE9F8" />
      <text x="395" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#173A63" text-anchor="middle" letter-spacing="0.8">ENTERPRISE CLOUD</text>
    </g>

    <!-- Headline Tagline -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="32" fill="#173A63" letter-spacing="-0.5">Your files. Organized. Under control.</text>

    <!-- Subtitle / Architecture Highlights -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="16" fill="#65758B">A production-ready full-stack cloud storage platform built with Next.js App Router,</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="400" font-size="16" fill="#65758B">TypeScript, PostgreSQL, Prisma, S3-compatible private object storage &amp; secure sharing.</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="94" height="28" rx="6" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.2" />
      <text x="47" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#285F9E" text-anchor="middle">Next.js 14</text>

      <!-- Pill 2 -->
      <rect x="104" y="0" width="102" height="28" rx="6" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.2" />
      <text x="155" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#285F9E" text-anchor="middle">TypeScript</text>

      <!-- Pill 3 -->
      <rect x="216" y="0" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.2" />
      <text x="270" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#285F9E" text-anchor="middle">PostgreSQL</text>

      <!-- Pill 4 -->
      <rect x="334" y="0" width="86" height="28" rx="6" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.2" />
      <text x="377" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#285F9E" text-anchor="middle">Prisma</text>

      <!-- Pill 5 -->
      <rect x="430" y="0" width="138" height="28" rx="6" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.2" />
      <text x="499" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#285F9E" text-anchor="middle">Private S3 Storage</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Layered SaaS Product Composition -->
  <g transform="translate(740, 50)">
    <!-- Back Card: Storage Breakdown -->
    <g transform="translate(60, 20) rotate(3)" filter="url(#softShadow)">
      <rect width="280" height="150" rx="12" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.5" />
      <rect x="20" y="20" width="100" height="10" rx="4" fill="#EEF3FA" />
      <rect x="20" y="44" width="240" height="12" rx="6" fill="#EEF3FA" />
      <rect x="20" y="44" width="160" height="12" rx="6" fill="#285F9E" />
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#173A63">12.4 GB <tspan font-weight="400" font-size="12" fill="#65758B">of 50 GB used</tspan></text>
      <!-- Micro File Items -->
      <rect x="20" y="100" width="80" height="24" rx="4" fill="#F7F9FC" stroke="#DCE5EF" />
      <text x="30" y="116" font-family="sans-serif" font-size="10" font-weight="600" fill="#477DB7">Documents</text>
      <rect x="110" y="100" width="65" height="24" rx="4" fill="#F7F9FC" stroke="#DCE5EF" />
      <text x="120" y="116" font-family="sans-serif" font-size="10" font-weight="600" fill="#477DB7">Media</text>
    </g>

    <!-- Front Main Card: File Vault Manager UI -->
    <g transform="translate(0, 75)" filter="url(#softShadow)">
      <rect width="360" height="225" rx="14" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="1.5" />
      
      <!-- Window Chrome -->
      <rect width="360" height="38" rx="14" fill="#F7F9FC" />
      <path d="M 0 38 L 360 38" stroke="#DCE5EF" stroke-width="1" />
      <circle cx="20" cy="19" r="4.5" fill="#E2ECF8" />
      <circle cx="34" cy="19" r="4.5" fill="#E2ECF8" />
      <circle cx="48" cy="19" r="4.5" fill="#E2ECF8" />
      <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#65758B">Vault Explorer • /Engineering/Q4_Specs</text>

      <!-- Row 1: Folder Item -->
      <g transform="translate(18, 52)">
        <rect width="324" height="42" rx="8" fill="#F7F9FC" stroke="#EEF3FA" />
        <!-- Folder Icon -->
        <path d="M 12 14 L 20 14 L 24 18 L 34 18 C 36 18 37 19 37 21 L 37 29 C 37 31 36 32 34 32 L 12 32 C 10 32 9 31 9 29 L 9 17 C 9 15 10 14 12 14 Z" fill="#477DB7" />
        <text x="46" y="24" font-family="sans-serif" font-weight="600" font-size="12" fill="#182B43">Architecture_Designs</text>
        <text x="46" y="34" font-family="sans-serif" font-size="10" fill="#65758B">8 files • Modified 2h ago</text>
        <rect x="270" y="14" width="44" height="18" rx="4" fill="#DCE9F8" />
        <text x="292" y="26" font-family="sans-serif" font-size="9" font-weight="700" fill="#173A63" text-anchor="middle">SHARED</text>
      </g>

      <!-- Row 2: File Item (Selected/Active) -->
      <g transform="translate(18, 102)">
        <rect width="324" height="48" rx="8" fill="#EEF3FA" stroke="#DCE9F8" stroke-width="1.5" />
        <!-- Doc Icon -->
        <path d="M 14 13 L 26 13 L 32 19 L 32 33 C 32 34.5 30.5 36 29 36 L 14 36 C 12.5 36 11 34.5 11 33 L 11 16 C 11 14.5 12.5 13 14 13 Z" fill="#285F9E" />
        <path d="M 26 13 L 26 19 L 32 19 Z" fill="#DCE9F8" />
        <text x="46" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#173A63">production-spec-v2.pdf</text>
        <text x="46" y="38" font-family="sans-serif" font-size="10" fill="#65758B">3.4 MB • Version 3 • Encrypted S3</text>
        <circle cx="304" cy="24" r="10" fill="#FFFFFF" stroke="#DCE5EF" />
        <path d="M 301 24 L 303 26 L 308 21" stroke="#285F9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Row 3: Security & Share Badge -->
      <g transform="translate(18, 160)">
        <rect width="324" height="42" rx="8" fill="#F7F9FC" stroke="#EEF3FA" />
        <!-- Key Icon -->
        <circle cx="22" cy="21" r="7" stroke="#477DB7" stroke-width="1.8" fill="none" />
        <path d="M 27 21 L 34 21 M 31 21 L 31 25" stroke="#477DB7" stroke-width="1.8" stroke-linecap="round" />
        <text x="46" y="22" font-family="sans-serif" font-weight="600" font-size="12" fill="#182B43">Presigned Expiring Links</text>
        <text x="46" y="33" font-family="sans-serif" font-size="10" fill="#65758B">Token Hashed • Revocable</text>
        <rect x="254" y="14" width="60" height="18" rx="4" fill="#EEF3FA" stroke="#DCE5EF" />
        <text x="284" y="26" font-family="sans-serif" font-size="9" font-weight="600" fill="#477DB7" text-anchor="middle">PASSCODE</text>
      </g>
    </g>
  </g>
</svg>
