    <!-- Secure Vault Dial / Central Core -->
    <circle cx="50" cy="45" r="9" fill="#173A63" />
    <circle cx="50" cy="45" r="6" fill="#FFFFFF" />
    <circle cx="50" cy="45" r="3.5" fill="#285F9E" />
    
    <!-- Vault Nodes -->
    <rect x="38" y="43.5" width="4" height="3" rx="1" fill="#477DB7" />
    <rect x="58" y="43.5" width="4" height="3" rx="1" fill="#477DB7" />
    <rect x="48.5" y="33" width="3" height="4" rx="1" fill="#477DB7" />
    <rect x="48.5" y="53" width="3" height="4" rx="1" fill="#477DB7" />
  </g>
</svg>
