<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cvFaviconGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#173A63" />
      <stop offset="100%" stop-color="#285F9E" />
    </linearGradient>
    <filter id="cvFaviconShadow" x="0" y="2" width="100" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173A63" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#F7F9FC" />
  
  <g filter="url(#cvFaviconShadow)">
